[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archive-script"
version = "0.1.0"
description = "S3 archiving script"
authors = [
    {name = "MatteoRakic"},
]
dependencies = [
    "boto3>=1.34.0",
    "polars>=1.0.0",
]
requires-python = ">=3.8"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.envs.default]
dependencies = [
    "boto3>=1.34.0",
    "polars>=0.20.0",
]

[tool.hatch.envs.lint]
dependencies = [
    "black>=23.0.0",
    "isort>=5.0.0",
    "pylint>=2.0.0",
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "too-few-public-methods",
] 